name: Build WiFi Camera APK

on:
  push:
    branches: [main, 'feature/parent-dashboard', 'fix/continuous-media-talkback', 'fix/stable-video-audio-v2', 'feature/parent-fullscreen-overlay-controls', 'feature/background-camera-foreground-service', 'feature/bazaar-365-day-subscription', 'feature/bazaar-subscription-price-lookup']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-camera-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
